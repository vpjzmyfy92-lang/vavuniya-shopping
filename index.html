<!DOCTYPE html>
<html>
<head>
<title>Vavuniya Shopping</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial;
  background: #f0f4f8;
  text-align: center;
  margin: 0;
  padding: 15px;
}

.header {
  background: green;
  color: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
}

input, textarea {
  padding: 12px;
  width: 80%;
  max-width: 400px;
  margin: 10px;
  border-radius: 8px;
  border: 1px solid gray;
}

.product {
  background: white;
  max-width: 400px;
  margin: 20px auto;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

img {
  max-width: 100%;
  height: auto;
}

button {
  background: green;
  color: white;
  padding: 12px 20px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  margin: 5px;
}

.clear {
  background: red;
}

#cartDetails {
  background: white;
  max-width: 400px;
  margin: auto;
  padding: 15px;
  border-radius: 10px;
}

.dashboard {
  background: white;
  padding: 20px;
  margin-top: 30px;
  border-radius: 12px;
}
</style>
</head>

<body>

<div class="header">
  <h1>🛍️ Vavuniya Shopping</h1>
  <p>Your Local Online Shopping Store</p>
</div>

<input
  type="text"
  id="search"
  placeholder="Search Products..."
  onkeyup="searchProducts()"
>

<h2>🛒 Available Products</h2>

<!-- EXISTING PRODUCTS -->

<div class="product">
  <img src="https://placehold.co/200x120?text=Rice">
  <h2>Rice</h2>
  <p>Rs. 250</p>
  <input type="number" id="riceQty" value="1" min="1">
  <button onclick="addToCart('Rice',250,'riceQty')">
    Buy Now
  </button>
</div>

<div class="product">
  <img src="https://placehold.co/200x120?text=Sugar">
  <h2>Sugar</h2>
  <p>Rs. 300</p>
  <input type="number" id="sugarQty" value="1" min="1">
  <button onclick="addToCart('Sugar',300,'sugarQty')">
    Buy Now
  </button>
</div>

<div class="product">
  <img src="https://placehold.co/200x120?text=Milk+Powder">
  <h2>Milk Powder</h2>
  <p>Rs. 500</p>
  <input type="number" id="milkQty" value="1" min="1">
  <button onclick="addToCart('Milk Powder',500,'milkQty')">
    Buy Now
  </button>
</div>

<!-- NEW PRODUCTS WILL APPEAR HERE -->

<div id="newStoreProducts"></div>

<!-- CART -->

<h2>🛒 My Cart</h2>

<p>Items: <span id="count">0</span></p>
<p>Total: Rs. <span id="total">0</span></p>

<h3>Order Details</h3>

<div id="cartDetails">
  No products added yet.
</div>

<br>

<button class="clear" onclick="clearCart()">
  Clear Cart
</button>

<!-- CUSTOMER DETAILS -->

<h2>📦 Customer Details</h2>

<input type="text" id="customerName" placeholder="Your Name">

<br>

<input type="tel" id="customerPhone" placeholder="Phone Number">

<br>

<textarea id="customerAddress" placeholder="Delivery Address"></textarea>

<br>

<button onclick="placeOrder()">
  Place Order on WhatsApp
</button>

<!-- DASHBOARD -->

<div class="dashboard">

<h2>🔐 Shop Owner Dashboard</h2>

<h3>Add New Product</h3>

<input type="text" id="newName" placeholder="Product Name">

<br>

<input type="number" id="newPrice" placeholder="Product Price">

<br>

<button onclick="addNewProduct()">
  Add Product
</button>

<p id="adminMessage"></p>

<h3>My Saved Products</h3>

<div id="savedProducts"></div>

</div>

<script>

let cart = 0;
let total = 0;
let cartItems = {};

// ADD TO CART

function addToCart(name, price, quantityId) {

  let quantity = Number(
    document.getElementById(quantityId).value
  );

  if (!Number.isInteger(quantity) || quantity < 1) {
    alert("Enter a valid quantity!");
    return;
  }

  cart += quantity;
  total += price * quantity;

  if (cartItems[name]) {
    cartItems[name] += quantity;
  } else {
    cartItems[name] = quantity;
  }

  updateCart();
  saveCart();
}

// UPDATE CART

function updateCart() {

  document.getElementById("count").innerText = cart;

  document.getElementById("total").innerText = total;

  let details = "";

  for (let product in cartItems) {
    details += "<p>" + product + " - " +
    cartItems[product] + " items</p>";
  }

  document.getElementById("cartDetails").innerHTML =
    details || "No products added yet.";
}

// SAVE CART

function saveCart() {

  localStorage.setItem("vavuniyaCart", JSON.stringify({
    cart: cart,
    total: total,
    cartItems: cartItems
  }));

}

// LOAD CART

function loadCart() {

  let savedCart = localStorage.getItem("vavuniyaCart");

  if (savedCart) {

    try {

      let data = JSON.parse(savedCart);

      cart = data.cart || 0;
      total = data.total || 0;
      cartItems = data.cartItems || {};

      updateCart();

    } catch (error) {

      localStorage.removeItem("vavuniyaCart");

    }
  }
}

// ADD NEW PRODUCT

function addNewProduct() {

  let name = document.getElementById("newName").value.trim();

  let price = Number(document.getElementById("newPrice").value);

  if (name === "" || !Number.isFinite(price) || price <= 0) {

    document.getElementById("adminMessage").innerText =
      "Please enter product name and valid price.";

    return;
  }

  let products = JSON.parse(
    localStorage.getItem("myProducts") || "[]"
  );

  products.push({
    name: name,
    price: price
  });

  localStorage.setItem("myProducts", JSON.stringify(products));

  document.getElementById("adminMessage").innerText =
    "Product added successfully!";

  document.getElementById("newName").value = "";

  document.getElementById("newPrice").value = "";

  // UPDATE BOTH LISTS

  showSavedProducts();
  showStoreProducts();
}

// SHOW PRODUCTS IN DASHBOARD

  function showSavedProducts() {

  let products = JSON.parse(
    localStorage.getItem("myProducts") || "[]"
  );

  let output = "";

  products.forEach(function(product, index) {

    output += `
      <div class="product">
        <h3>${product.name}</h3>
        <p>Rs. ${product.price}</p>

        <button onclick="editProduct(${index})">
          Edit Price
        </button>

        <button onclick="deleteProduct(${index})" class="clear">
          Delete
        </button>
      </div>
    `;

  });

  document.getElementById("savedProducts").innerHTML =
    output || "No products added yet.";
}

// SHOW NEW PRODUCTS IN SHOPPING STORE

function showStoreProducts() {

  let products = JSON.parse(
    localStorage.getItem("myProducts") || "[]"
  );

  let container = document.getElementById("newStoreProducts");

  container.innerHTML = "";

  products.forEach(function(product, index) {

    let card = document.createElement("div");

    card.className = "product";

    let title = document.createElement("h2");
    title.textContent = product.name;

    let price = document.createElement("p");
    price.textContent = "Rs. " + product.price;

    let quantity = document.createElement("input");
    quantity.type = "number";
    quantity.value = "1";
    quantity.min = "1";
    quantity.id = "newQty" + index;

    let button = document.createElement("button");
    button.textContent = "Buy Now";

    button.addEventListener("click", function() {

      addToCart(
        product.name,
        product.price,
        quantity.id
      );

    });

    card.appendChild(title);
    card.appendChild(price);
    card.appendChild(quantity);
    card.appendChild(document.createElement("br"));
    card.appendChild(button);

    container.appendChild(card);

  });

}

// SEARCH PRODUCTS

function searchProducts() {

  let input = document.getElementById("search")
    .value.toLowerCase();

  let products = document.getElementsByClassName("product");

  for (let i = 0; i < products.length; i++) {

    let name = products[i].innerText.toLowerCase();

    products[i].style.display =
      name.includes(input) ? "block" : "none";

  }
}

// CLEAR CART

function clearCart() {

  cart = 0;
  total = 0;
  cartItems = {};

  updateCart();
  saveCart();

  alert("Cart cleared successfully!");

}

// PLACE ORDER

function placeOrder() {

  let name = document.getElementById("customerName").value.trim();

  let phone = document.getElementById("customerPhone").value.trim();

  let address = document.getElementById("customerAddress").value.trim();

  if (name === "" || phone === "" || address === "") {

    alert("Please fill all customer details!");
    return;

  }

  if (cart === 0) {

    alert("Please add products to cart!");
    return;

  }

  let orderId = "VAV" + Date.now();

  let message = "🛍️ NEW ORDER\n\n";

  message += "Order ID: " + orderId + "\n";
  message += "Customer: " + name + "\n";
  message += "Phone: " + phone + "\n";
  message += "Address: " + address + "\n\n";

  message += "ORDER ITEMS:\n";

  for (let product in cartItems) {

    message += product + " - " +
    cartItems[product] + " items\n";

  }

  message += "\nTotal: Rs. " + total;

  let businessNumber = "94777547953";

  let whatsappURL =
    "https://wa.me/" + businessNumber +
    "?text=" + encodeURIComponent(message);

  window.open(whatsappURL, "_blank");

}

// LOAD EVERYTHING WHEN WEBSITE OPENS

loadCart();
showSavedProducts();
showStoreProducts();

</script>

</body>
</html>
